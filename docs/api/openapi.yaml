    post:
      tags: [Viewer]
      summary: Post a comment or a reply
      description: A `parent_id` must belong to the same episode, or the reply is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 2, maxLength: 2000 }
                parent_id: { type: integer, nullable: true, description: The comment being replied to. }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          comment: { $ref: '#/components/schemas/Comment' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /comments/{id}:
    delete:
      tags: [Viewer]
      summary: Delete your own comment
      description: |
        Admins may delete any. Somebody else's comment answers NOT_FOUND
        rather than 403, so the endpoint cannot be used to confirm a comment
        exists.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Removed
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /notifications:
    get:
      tags: [Viewer]
      summary: The viewer's notifications
      description: |
        **This is the fallback that makes push safe.** Push is an accelerator,
        never the transport — an OEM battery manager kills processes, tokens go
        stale, handsets sit offline for a day. Everything a push says is
        readable here, and the app must be usable with push switched off
        entirely.

        Carries `unread_count`, so a badge costs one request rather than two.
        The count is of the whole inbox and never of the filtered page: it is the
        bell's badge, and a badge that moved when a chip was pressed would be
        reporting the chip.

        `category` filters on the server because the list is cursor-paginated —
        filtering the page the app happens to hold would hide matching rows until
        the viewer scrolled far enough to load them. An unrecognised category is a
        422, never a silently unfiltered list.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - name: category
          in: query
          schema: { type: string, enum: [movies, series, account, offers] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          unread_count: { type: integer }
                          items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                          next_cursor: { type: string, nullable: true }
    delete:
      tags: [Viewer]
      summary: Clear every notification
      responses:
        '200':
          description: Cleared
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /notifications/read-all:
    post:
      tags: [Viewer]
      summary: Mark everything read
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /notifications/{id}/read:
    post:
      tags: [Viewer]
      summary: Mark one read
      description: Idempotent — an already-read notification is a success.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /notifications/{id}:
    delete:
      tags: [Viewer]
      summary: Delete one
      description: Idempotent — deleting one already gone is a success, so a retry cannot fail.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /notifications/preferences:
    get:
      tags: [Viewer]
      summary: Notification channels, and per-category preferences
      description: |
        Two layers, and they are not the same thing.

        `channels` is the viewer's global per-channel switch — the three columns on
        `users` that form layer 4 of the gate in `ChannelGatedNotification`, and the
        three switches the website's own "Delivery preferences" card renders.

        `preferences` is the per-notification-type opt-out, which can only narrow
        what `channels` allows.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          channels: { $ref: '#/components/schemas/NotificationChannels' }
                          email_verified:
                            type: boolean
                            description: |
                              Whether the address the emails would go to is confirmed. The
                              website says this beside its Email switch, because it is a
                              fact the switch itself cannot show.
                          preferences: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } }
    put:
      tags: [Viewer]
      summary: Set channels, preferences, or both
      description: |
        Both keys are optional; a request carrying neither is a 422. A PUT that
        validates and changes nothing reads as success to the app, which leaves the
        switch where the viewer put it while the server disagrees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channels: { $ref: '#/components/schemas/NotificationChannels' }
                preferences:
                  type: array
                  items: { $ref: '#/components/schemas/NotificationPreference' }
      responses:
        '200':
          description: Saved, and the full set returned
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /notifications/push-token:
    post:
      tags: [Viewer]
      summary: Register this install's FCM token
      description: |
        The token is stored against the device row, which means **signing out
        deletes it** — a shared handset must never keep the previous account's
        token and deliver their notifications to whoever is holding the phone.
        Booting the device from elsewhere clears it too.

        A token can belong to only one install: registering one already held
        elsewhere moves it. Android reissues the same token to a reinstall, and
        two rows holding it would mean one push delivered twice.

        `push_enabled` is this handset's own switch, separate from the
        per-category preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 512 }
                push_enabled: { type: boolean, nullable: true }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          registered: { type: boolean }
                          push_enabled: { type: boolean }
        '404':
          description: DEVICE_NOT_FOUND — this session has no device row to attach a token to
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    delete:
      tags: [Viewer]
      summary: Stop pushing to this install
      description: Signing out does this too. This is for the viewer who wants the app but not the notifications.
      responses:
        '200':
          description: Unregistered
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /plans:
    get:
      tags: [App]
      summary: The plans on offer
      description: |
        Public. The Google Play build is consumption-only under ADR-0004 — it
        shows what a plan costs and sells nothing — so this has to be readable
        without a token.

        `max_concurrent_streams` null means the plan sets no cap. Render
        "unlimited", never "0" and never "none".
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          plans: { type: array, items: { $ref: '#/components/schemas/Plan' } }

  /subscription:
    get:
      tags: [Viewer]
      summary: The viewer's plan, with the plan list beside it
      description: |
        `GET /me` carries a summary for the launch screen; this is the
        membership screen. The plan list comes with it so an upgrade prompt can
        be drawn from one request.

        **There is no checkout endpoint.** The Play build may not sell, and the
        direct APK's in-app PesaPal is not built yet — reusing the website's
        order creation safely means extracting money code (server-authored
        price, frozen price snapshot, referral discount) into a shared service.
        See docs/api/coverage.md.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          subscription:
                            nullable: true
                            allOf: [{ $ref: '#/components/schemas/Subscription' }]
                          plans: { type: array, items: { $ref: '#/components/schemas/Plan' } }

  /subscription/orders:
    get:
      tags: [Viewer]
      summary: Payment history
      description: Amounts come off the order row — an invoice says what was paid, not what the plan costs today.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/PaymentOrder' } }
                          next_cursor: { type: string, nullable: true }
                          totals: { $ref: '#/components/schemas/SpendTotals' }
    post:
      tags: [Viewer]
      summary: Start paying for a plan
      description: |
        Creates a pending order and returns where to send the payer.

        **The request names a plan and nothing else.** There is no `amount`,
        no `currency` and no gateway: the server reads the price off the tier
        row, freezes it into `metadata.tier_snapshot`, computes any referral
        discount itself, and picks the gateway from `payments.default_gateway`.
        A client cannot pair a plan with a price of its own, and adding a
        second gateway is a server change this contract does not see.

        **Who may call it is decided by the app, not here.** ADR-0004 makes the
        Google Play build consumption-only, because Play's Payments policy
        requires Play Billing for subscription video outside IN/KR/EEA/US. The
        direct APK shows the button; the Play build does not. The server does
        not police the variant — Google inspects the binary, not the API, and a
        variant flag sent by a client is not a security control.

        The payer finishes in a browser. The gateway confirms to the **server**,
        so a client should poll `GET /subscription/orders/{reference}` rather
        than treating its own return as proof of payment.

        Rate limited below the auth rate and fails closed: every call mints an
        order row and a gateway order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier_slug]
              properties:
                tier_slug:
                  type: string
                  maxLength: 100
                  description: An active, paid tier. A free or withdrawn plan is refused.
      responses:
        '200':
          description: Order created; send the payer to `redirect_url`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          checkout:
                            type: object
                            description: |
                              **How to present the checkout, not which gateway made it.**
                              The app ships knowing a closed set of modes and the server
                              picks one per order, so a gateway added later needs no app
                              release — which is the point: a phone that has not updated
                              in a year still completes the sale.
                            properties:
                              mode:
                                type: string
                                enum: [webview, redirect]
                                description: |
                                  `webview` hosts it inside the app, which is what every
                                  hosted checkout fits, PesaPal's iframe included.
                                  `redirect` opens it outside. A client meeting a mode it
                                  does not know must fall back to `redirect`.
                              url: { type: string }
                              return_url: { type: string, description: 'Jambo own URL. Navigation here means the flow finished.' }
                              cancel_url: { type: string, description: 'Jambo own URL. Navigation here means the payer backed out.' }
                          reference: { type: string, description: 'The merchant reference, for polling the order.' }
        '404':
          description: NOT_FOUND — no such active plan.
        '422':
          description: VALIDATION_FAILED — the plan is free, or no slug was sent.
        '429':
          description: RATE_LIMITED.
        '500':
          description: SERVER_ERROR — payments unconfigured, or the gateway refused.

  /subscription/orders/{reference}:
    get:
      tags: [Viewer]
      summary: One order
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          order: { $ref: '#/components/schemas/PaymentOrder' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /referrals:
    get:
      tags: [Viewer]
      summary: Refer and earn
      description: |
        404 while the referral programme is switched off — **except** for a
        viewer who already has wallet history, whose earned money must not
        become unreachable because a setting changed. That is the website's
        rule and it looks like a bug otherwise.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/ReferralDashboard' }
        '404':
          description: NOT_FOUND — the programme is off and this viewer has no wallet history
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /referrals/code/check:
    post:
      tags: [Viewer]
      summary: Is this referral code free?
      description: |
        Live availability while a code is being typed, so a viewer learns a
        code is taken before they submit rather than from a 422.

        **Never says available for something `PUT /referrals/code` would
        reject.** Both go through `ReferralCodeRules`, which is also what the
        website's own form and its `/referrals/check-code` endpoint use — so
        the four cannot drift apart. That matters because a referral code
        shares a namespace with usernames: the profile hub lives at
        `/{username}`, so a code is also a URL segment and cannot be a name the
        router already owns.

        POST rather than GET: the code is user input and a GET would put every
        keystroke in an access log.

        An unusable code is `available: false` with a reason, not a validation
        error — a 422 per keystroke is not a useful answer to somebody
        mid-word. A 404 means the referral programme is switched off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          available:
                            type: boolean
                          message:
                            type: string
                            description: Why, in words a viewer can read.
        '404':
          description: The referral programme is not available.
  /referrals/code:
    put:
      tags: [Viewer]
      summary: Set a custom referral code
      description: |
        The code shares a namespace with usernames — a profile lives at
        /{username} — so it must be free against both columns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-zA-Z0-9_.\-]+$' }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '422':
          description: VALIDATION_FAILED — taken, or colliding with a username
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /wallet:
    get:
      tags: [Viewer]
      summary: Balance, ledger and withdrawals
      description: |
        Every entry records the balance after it, so a client never adds money up
        itself.

        `withdrawals` carries the ten most recent requests, and it is not
        decoration: the hold is taken the moment a withdrawal is requested, so a
        balance that has dropped with nothing paid out yet has no explanation
        without it. `has_open_withdrawal` is computed from the same statuses the
        service guards on, so the button an app draws and the rule the server
        enforces cannot disagree.

        **Money arrives as a string, and its decimal formatting follows the
        database.** MySQL answers `"15000.00"` where SQLite answers `"15000"`.
        Format for display; never compare these as strings.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/Wallet' }

  /wallet/withdrawals:
    post:
      tags: [Viewer]
      summary: Request a cash withdrawal
      description: |
        Money leaving the business. Added 2026-09-09 so the app's wallet screen can
        finish the task rather than send a viewer to a browser.

        **It writes no money logic of its own.** The controller calls
        `ReferralWalletService::requestWithdrawal`, which is the entry point the
        website's own form posts to, and `Payouts::request` below that is where the
        row lock, the one-open-request guard and the ledger hold live. The whole
        thing runs in a transaction: if the ledger refuses the hold, the request row
        rolls back with it.

        **A retry is safe without an idempotency key.** The service locks the owner
        row and refuses a second open request, so a resubmit over a dropped
        connection cannot create two withdrawals — it returns 422 instead, and the
        client refetches to show the one that exists.

        A 422 carries a message written for a viewer: the minimum, the withdrawal
        already in progress, or the insufficient balance. All three are answers
        rather than faults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payee_name, payee_msisdn]
              properties:
                amount: { type: number, minimum: 1 }
                payee_name: { type: string, maxLength: 100 }
                payee_msisdn:
                  type: string
                  maxLength: 30
                  pattern: '^[0-9+ ]{7,30}$'
                  description: |
                    The same rule the website's form applies. A number the browser
                    rejects and the app accepts is a payout that fails at the till.
      responses:
        '200':
          description: Requested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          withdrawal: { $ref: '#/components/schemas/Withdrawal' }
                          balance:
                            type: string
                            description: The balance after the hold, so a client never subtracts it itself.
        '404': { description: The wallet is not available to this viewer }
        '422': { description: 'Refused, with a message written for a viewer' }

  /watchlist:
    get:
      tags: [Viewer]
      summary: The viewer's watchlist
      description: Rows whose title has since been deleted are dropped rather than returned as nulls.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/WatchlistCard'
    post:
      tags: [Viewer]
      summary: Add a title to the watchlist
      description: |
        Idempotent — adding something already on the list succeeds and changes
        nothing, so a retry after a dropped connection is safe. This is
        deliberately not the website's toggle endpoint: a retried toggle
        silently undoes itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [movie, show, episode] }
                id: { type: integer }
      responses:
        '200':
          description: On the list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          in_list: { type: boolean }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /watchlist/{type}/{id}:
    delete:
      tags: [Viewer]
      summary: Remove a title from the watchlist
      description: Idempotent — removing something that is not on the list is a success, not a 404.
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [movie, show, episode] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Not on the list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          in_list: { type: boolean }

  /continue-watching:
    get:
      tags: [Viewer]
      summary: Continue Watching as its own screen
      description: |
        The same cards the home screen's `continue_watching` rail carries, from
        the same service, so the two cannot disagree about where the viewer
        stopped. Finished titles are excluded; see /history for those.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ContinueWatchingCard' }

  /history:
    get:
      tags: [Viewer]
      summary: Everything watched, newest first
      description: A record rather than a to-do list, so unlike Continue Watching it keeps finished titles.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/HistoryEntry' }
                          next_cursor: { type: string, nullable: true }

  /search/suggest:
    get:
      tags: [Catalogue]
      summary: Type-ahead suggestions
      description: |
        Deliberately thinner and shorter than /search — five of each and only
        the fields a dropdown row draws, because a viewer sends this on every
        keystroke over a mobile connection. Fewer than two characters returns
        an empty list rather than an error.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          query: { type: string }
                          suggestions: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }

  /tags:
    get:
      tags: [Catalogue]
      summary: Every tag
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          tags: { type: array, items: { $ref: '#/components/schemas/GenreCard' } }

  /tags/{slug}:
    get:
      tags: [Catalogue]
      summary: One tag and its published titles
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/TaxonomyPage' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /cast:
    get:
      tags: [Catalogue]
      summary: Everyone with published work
      description: |
        Ordered by how much of the catalogue they appear in, which is what
        makes the grid useful. Paged by offset: the primary order is a raw
        expression a cursor cannot be built from.
      security: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/PersonCard' } }
                          page: { type: integer }
                          per_page: { type: integer }
                          total: { type: integer }
                          next_page: { type: integer, nullable: true }

  /collections:
    get:
      tags: [Catalogue]
      summary: Which "see all" collections exist
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          collections:
                            type: array
                            items:
                              type: object
                              properties:
                                key: { type: string }
                                title: { type: string }
                                type: { type: string, enum: [movie, show] }

  /collections/{rail}:
    get:
      tags: [Catalogue]
      summary: The full list behind a home rail
      description: |
        The same catalog the website's /collection/{rail} page uses, so the
        app's "see all" and the site's cannot diverge.

        Personalised rails (top-picks, smart-shuffle, fresh-picks) pin the
        viewer's own recommendations to the front, so send a bearer token to
        get a personal ordering.

        Paged by offset, unlike the catalogue lists. Pinned rails order with
        a raw expression a cursor cannot be built from, and plain rails order
        on created_at, which bulk-imported titles share to the second - a
        cursor on it dropped every tied row. The website pages these by
        offset too.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: rail, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 24, maximum: 60 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          key: { type: string }
                          title: { type: string }
                          items:
                            type: array
                            items:
                              oneOf:
                                - $ref: '#/components/schemas/MovieCard'
                                - $ref: '#/components/schemas/SeriesCard'
                          page: { type: integer }
                          per_page: { type: integer }
                          total: { type: integer }
                          next_page: { type: integer, nullable: true, description: null on the last page. }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /pages:
    get:
      tags: [App]
      summary: The CMS pages
      description: |
        About, FAQ, Privacy, Terms. Generic on purpose: adding a page in the
        admin makes it available to the app with no release, and Google Play
        requires a subscription app to show its terms and privacy policy.

        Structural rows the website assembles into chrome (the footer, anything
        flagged system) are excluded from this list but remain fetchable by
        slug.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          pages:
                            type: array
                            items:
                              type: object
                              properties:
                                slug: { type: string }
                                title: { type: string }
                                summary: { type: string, nullable: true }

  /pages/{slug}:
    get:
      tags: [App]
      summary: One CMS page
      description: '`content` is admin-authored HTML, the same string the website renders.'
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          page:
                            type: object
                            properties:
                              slug: { type: string }
                              title: { type: string }
                              content: { type: string, description: Admin-authored HTML. }
                              summary: { type: string, nullable: true }
                              image_url: { type: string }
                              updated_at: { type: string, format: date-time, nullable: true }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /playback/sessions:
    post:
      tags: [Playback]
      summary: Authorize playback and get a URL
      description: |
        Runs the same entitlement rules as the website (PlaybackAuthorizer):
        release state, the site-wide sign-up switch, the plan level with an
        episode inheriting its series' plan, the admin bypass, and the
        concurrent-stream cap keyed on this device's uuid.

        `source` is `file` for titles Jambo hosts and `embed` for YouTube-backed
        ones, which cannot be downloaded and must be opened in an embed.

        A `low` request for a title with no data-saver rendition is refused
        rather than silently served at full size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [movie, episode] }
                id: { type: integer }
                quality: { type: string, enum: [default, low], default: default }
      responses:
        '200':
          description: Authorized
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PlaybackSession'
        '401':
          description: UNAUTHENTICATED or LOGIN_REQUIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: SUBSCRIPTION_REQUIRED or UPGRADE_REQUIRED, with `required_tier`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeError'
                  - properties:
                      required_tier: { $ref: '#/components/schemas/Tier' }
        '404':
          description: NOT_FOUND, or CONTENT_UNAVAILABLE for an unreleased title or a missing rendition
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '409':
          description: STREAM_LIMIT — entitled, but already watching on as many devices as the plan allows
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /playback/heartbeat:
    post:
      tags: [Playback]
      summary: Report playback position
      description: |
        Send every `heartbeat_seconds` while playing. Records the resume
        position, refreshes the live-stream signal the cap reads, and raises the
        event partner earnings accrue from — the same recorder the website uses.

        A 409 means this device was booted from the account mid-stream: stop
        playing and sign out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id, position]
              properties:
                type: { type: string, enum: [movie, episode] }
                id: { type: integer }
                position: { type: integer, minimum: 0, description: Seconds into the title }
                duration: { type: integer, minimum: 1, description: 'Player-reported runtime, when known' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          position: { type: integer }
                          completed: { type: boolean }
        '409':
          description: DEVICE_REVOKED — this device was signed out mid-stream
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Sanctum personal access token from /auth/login, bound to one device.

  schemas:
    EnvelopeOk:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { type: object }

    EnvelopeError:
      type: object
      required: [success, code, message, errors]
      properties:
        success: { type: boolean, enum: [false] }
        code:
          type: string
          description: Branch on this, never on `message`.
          enum:
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - ACCOUNT_DEACTIVATED
            - TWO_FACTOR_REQUIRED
            - TWO_FACTOR_INVALID
            - TWO_FACTOR_CHALLENGE_EXPIRED
            - DEVICE_REVOKED
            - DEVICE_NOT_FOUND
            - LOGIN_REQUIRED
            - SUBSCRIPTION_REQUIRED
            - UPGRADE_REQUIRED
            - STREAM_LIMIT
            - CONTENT_UNAVAILABLE
            - VALIDATION_FAILED
            - NOT_FOUND
            - FORBIDDEN
            - RATE_LIMITED
            - APP_UPDATE_REQUIRED
            - SERVER_ERROR
        message: { type: string }
        errors:
          type: object
          description: Field-keyed validation messages; empty object when not a validation failure.

    AppConfig:
      type: object
      properties:
        min_app_version: { type: string, example: '1.0.0' }
        server_time: { type: string, format: date-time }
        features:
          type: object
          properties:
            downloads: { type: boolean }
            in_app_subscribe: { type: boolean }
            account_deletion:
              type: boolean
              description: |
                Whether the app offers its "Delete account" button. Set from
                admin settings (`app.account_deletion_enabled`) and **defaults
                to true**, unlike the flags around it: those gate features that
                are not finished, this one gates a feature that is, and a
                missing settings row must not silently take away somebody's
                ability to close their own account.

                `DELETE /account` checks the same setting and refuses with
                FORBIDDEN when it is off, so turning it off stops a build that
                already draws the button. This flag only decides whether the
                row is drawn.

            google_sign_in:
              type: boolean
              description: |
                Whether this server has Google sign-in configured. The sign-in
                screen needs it before anyone is authenticated, which is why it
                is here rather than only in /account/security. False means hide
                the button: `POST /auth/google` cannot succeed without it.
            referrals:
              type: boolean
              description: |
                Whether the referral program is switched on. The website's
                profile sidebar hides its "Refer & Earn" tab on the same
                condition, and the app's profile drawer is that sidebar.
                False means omit the row: the page behind it is disabled.
        support:
          type: object
          properties:
            site_url: { type: string }
        branding:
          type: object
          description: |
            The admin's own logo and preloader, so branding changes without a
            new APK. Both URLs are absolute and carry a `?v=` fingerprint of
            the file's modification time: the app caches them on disk and
            reuses them offline, so a replaced image is simply a different URL
            and is fetched exactly once. Null when the setting is unset and no
            fallback resolves.

            The launcher icon and the splash screen are deliberately not here.
            Android reads both out of the APK before any JavaScript runs, so no
            endpoint can change them.
          properties:
            logo_url: { type: string, nullable: true, description: 'Wordmark, as the website''s auth header shows it.' }
            preloader_url: { type: string, nullable: true, description: 'The site''s loading animation. Usually an animated GIF.' }

    DeviceRegistration:
      type: object
      required: [uuid, platform]
      description: Generated by the app at first launch. The uuid is also this device's streaming session key.
      properties:
        uuid: { type: string, minLength: 8, maxLength: 64 }
        platform: { type: string, enum: [android, android_tv] }
        name: { type: string, maxLength: 120 }
        model: { type: string, maxLength: 120 }
        app_version: { type: string, maxLength: 32 }

    Profile:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        username:
          type: string
          description: Also the account's referral code and its profile URL.
        email: { type: string }
        phone: { type: string, nullable: true }
        country:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
          description: |
            ISO-3166-1 alpha-2, upper case. Null when the viewer has never set
            one, which is most accounts — render a dash, never a guess.
          example: UG
        country_name:
          type: string
          nullable: true
          description: |
            The display name for `country`, derived server-side so no client
            carries a 250-row lookup to render one row. Null exactly when
            `country` is null. Falls back to the code itself on a server
            without the `intl` extension.
          example: Uganda
        email_verified: { type: boolean }
        avatar_url:
          type: string
          nullable: true
          description: |
            A path relative to the public root, like every other image this API
            returns — `poster_url` is `/storage/gallery/...` and this is the
            same shape. Resolve it against the host you are talking to, NOT
            against any host the payload names.

            The exception is an image this server does not host: an
            admin-pasted Dropbox or Backblaze link comes back as the absolute
            URL it was stored as, and must be used verbatim.

            Null when the account has never uploaded a photo, which is most of
            them. Draw the viewer's initial rather than a stock face.
          example: /storage/3/hQmG5DJV3C04a6rpVMWVY25Zv88WV3hVzz41L8gp.png
        joined_at: { type: string, format: date-time, nullable: true }

    StreamingPreferences:
      type: object
      description: |
        Kept with the account, not the handset, so the same choices hold on a
        second phone and on the television in Phase 4.
      properties:
        video_quality:
          type: string
          enum: [auto, high, data_saver]
          description: |
            Jambo has exactly two renditions — `video_url` and `video_url_low`,
            which `/playback/sessions` selects with `quality: default|low`. So
            these three values are two files plus the choice to pick between
            them automatically, NOT a resolution ladder. `high` always asks for
            `default`; `data_saver` always asks for `low`; `auto` lets the
            client decide, which today means the connection it is on.
        autoplay_next:
          type: boolean
          description: |
            Roll into the next episode. The website's player already has this
            switch; until now it was per-session and forgotten on reload.
        wifi_only_downloads:
          type: boolean
          description: |
            Hold downloads until the device is on Wi-Fi. Stored now so Phase 3
            inherits the viewer's answer, but a client MUST NOT show this
            control while `features.downloads` is false — a switch governing a
            feature that does not exist is a setting that appears to do
            nothing.

    SecurityState:
      type: object
      properties:
        two_factor:
          type: object
          properties:
            enabled: { type: boolean }
            pending:
              type: boolean
              description: A secret exists but no code has confirmed it yet.
            secret:
              type: string
              nullable: true
              description: Only while pending or enabled. Render the QR from this.
            recovery_codes: { type: array, items: { type: string } }
        google_enabled: { type: boolean, description: Whether this server has Google sign-in configured. }
        email_verified: { type: boolean }

    Device:
      type: object
      description: |
        One thing signed into the account. `kind` says which: an app install or
        a browser session. `id` is the device uuid for an app and the session
        id for a browser — one field, because DELETE /devices/{id} takes
        either.
      properties:
        id: { type: string }
        kind: { type: string, enum: [app, browser] }
        name: { type: string, nullable: true, description: 'For a browser, the parsed user agent.' }
        icon:
          type: string
          description: |
            A Phosphor icon name for this row — `ph-desktop`, `ph-device-mobile`,
            `ph-television`, `ph-globe`.

            For a browser it is whatever `UserAgent::parse` decided, which is the
            same call the website's own device list draws from, so the two surfaces
            cannot disagree about the same user agent. For an app install it comes
            from `platform`.

            Clients resolve it through their icon table rather than branching on
            `kind`: a browser row has no `platform`, so without this every browser
            would be the same picture.
        model: { type: string, nullable: true, description: App installs only. }
        platform: { type: string, nullable: true, enum: [android, android_tv, null] }
        app_version: { type: string, nullable: true, description: App installs only. }
        ip_address:
          type: string
          nullable: true
          description: |
            The address this thing last spoke from. Browser sessions have always
            carried one; app installs record it as of 2026-09-09, one value only,
            overwritten when the device moves.
        location:
          type: string
          nullable: true
          description: |
            "Kampala, Uganda", resolved at read time from `ip_address` and never
            stored. **Null is the normal answer** and clients must render it: a
            private address has no location, and the geolocation database is not in
            the repository, so a server without one answers null for every row. Fall
            back to showing `ip_address`, which is what the website shows.

            Never guessed. A wrong city on a security screen is worse than no city,
            because the whole point of the line is that a viewer can say they have
            never been there.
        last_seen_at: { type: string, format: date-time, nullable: true }
        is_current: { type: boolean }

    Session:
      type: object
      properties:
        token: { type: string, description: Bearer token. Store securely; it does not expire on a timer. }
        device:
          type: object
          properties:
            uuid: { type: string }
            platform: { type: string }
            name: { type: string, nullable: true }
        user:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            email: { type: string }

    Tier:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        access_level: { type: integer }

    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            first_name: { type: string }
            last_name: { type: string }
            username: { type: string }
            email: { type: string }
            is_admin: { type: boolean }
        subscription:
          type: object
          nullable: true
          properties:
            tier: { $ref: '#/components/schemas/Tier' }
            starts_at: { type: string, format: date-time, nullable: true }
            ends_at: { type: string, format: date-time, nullable: true }
        limits:
          type: object
          properties:
            max_concurrent_streams:
              type: integer
              nullable: true
              description: null means the plan sets no cap. Render "unlimited", not "none".
        server_time: { type: string, format: date-time }

    Home:
      type: object
      properties:
        hero:
          type: array
          description: |
            The home banner. Curated at /admin/featured, falling back to an
            automatic mix. Movies and series interleaved.

            These are NOT poster cards. The banner is the website's
            full-bleed slide - `components/partials/hero-banner.blade.php` -
            and it draws a backdrop, a synopsis and three taxonomy lines that
            a rail's card has no reason to carry. The rails below it are
            still MovieCard / SeriesCard.
          items:
            oneOf:
              - $ref: '#/components/schemas/MovieHero'
              - $ref: '#/components/schemas/SeriesHero'
        rails:
          type: array
          items: { $ref: '#/components/schemas/Rail' }
        server_time: { type: string, format: date-time }

    Rail:
      type: object
      properties:
        key:
          type: string
          description: |
            Stable identifier. Category shelves are `category:<slug>`, so this
            set is open-ended - never switch on it exhaustively.
          example: top_movies
        title:
          type: string
          description: |
            Already translated, and the same string the website renders.
            ABSENT on `kind: banner` - a full-width banner carries no shelf
            heading on either surface, so there is nothing to draw.
        kind:
          type: string
          description: |
            What shape the items are, and so which component renders them.
            Treat an unknown kind as a rail to skip.
          enum: [titles, progress, genres, vjs, people, banner]
        style:
          type: string
          description: |
            How to present this rail, where `kind` says what is in it. Absent
            means the ordinary treatment for that kind, which is what almost
            every rail wants - so a client reads this with a default and never
            switches on it exhaustively.

            `numbered` is a `titles` rail drawn with the Top 10 numerals.
            `movies_today` and `series_today` are the two daily banners; they
            differ in layout, not only in wording, so they are two styles
            rather than one banner that inspects its items.

            This field exists so a ranked shelf added on the server looks
            right with no app release. It replaced a hardcoded set of two
            rail keys in the app on 2026-09-10.
          enum: [numbered, movies_today, series_today]
        items:
          type: array
          description: Shape depends on `kind`. Never empty - an empty rail is omitted.
          items:
            oneOf:
              - $ref: '#/components/schemas/MovieCard'
              - $ref: '#/components/schemas/SeriesCard'
              - $ref: '#/components/schemas/ContinueWatchingCard'
              - $ref: '#/components/schemas/GenreCard'
              - $ref: '#/components/schemas/VjCard'
              - $ref: '#/components/schemas/PersonCard'
              - $ref: '#/components/schemas/MovieBannerSlide'
              - $ref: '#/components/schemas/SeriesBannerSlide'

    ContinueWatchingCard:
      type: object
      description: kind = progress.
      properties:
        title: { type: string }
        subtitle: { type: string, description: 'For a series, S01E02 and the episode title.' }
        image_url: { type: string }
        progress_percent: { type: integer }
        minutes_left: { type: integer }
        position_seconds: { type: integer }
        resume:
          type: object
          description: |
            What to play. For a series this is the EPISODE, not the show -
            deliberately different from `remove` below.
          properties:
            type: { type: string, enum: [movie, episode] }
            id: { type: integer }
        remove:
          type: object
          description: |
            What to forget. For a series this is the SHOW: the rail dedupes by
            show, so removing one episode would let the card re-surface.
          properties:
            type: { type: string, enum: [movie, show] }
            id: { type: integer }

    ReviewThread:
      type: object
      properties:
        stats:
          type: object
          properties:
            count: { type: integer }
            average:
              type: number
              description: |
                Rounded to one decimal, matching the website's star display.
                JSON drops a zero fraction, so a whole average arrives as 4
                rather than 4.0 - parse as a float.
        mine:
          allOf: [{ $ref: '#/components/schemas/Review' }]
          nullable: true
          description: This viewer's own review, or null. Requires a bearer token.
        items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        next_cursor: { type: string, nullable: true }

    Review:
      type: object
      properties:
        id: { type: integer }
        stars: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string, nullable: true }
        body: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        author: { $ref: '#/components/schemas/Author' }

    Comment:
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        author: { $ref: '#/components/schemas/Author' }
        is_mine: { type: boolean, description: Whether the signed-in viewer wrote it. False for guests. }

    CommentThread:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          properties:
            replies: { type: array, items: { $ref: '#/components/schemas/Comment' } }

    Plan:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: string, description: 'Decimal string. Do not parse as a float for display.' }
        currency: { type: string }
        billing_period: { type: string, enum: [daily, weekly, monthly, yearly] }
        period_label:
          type: string
          description: |
            The suffix under the price, as the website writes it: "per day",
            "per week", "per month", "per year". Authored server-side so a
            client never has to keep its own copy of the mapping.
        access_level: { type: integer }
        max_concurrent_streams:
          type: integer
          nullable: true
          description: null means no cap. Render "unlimited".
        features:
          type: array
          items: { type: string }
          description: |
            What the plan includes, as the admin wrote it, and the same list
            the website's pricing cards render. Always present; an empty array
            means no features have been written, never a missing field.

            Added 2026-09-09. It existed on the column all along and this
            endpoint did not forward it, which left the app with a price
            ladder and no stated reason to choose one rung over another.
        is_popular:
          type: boolean
          description: |
            True on the one tier that wears the "Most popular" pill. Decided
            server-side by `SubscriptionTier::popularFrom` — the highest
            access level among monthly paid tiers, falling back to the highest
            paid tier — which is the same call the website's pricing page
            makes, so the two surfaces cannot mark different plans.

    Subscription:
      type: object
      properties:
        status: { type: string }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        auto_renew: { type: boolean }
        tier: { $ref: '#/components/schemas/Plan' }

    PaymentOrder:
      type: object
      description: |
        One charge on the account, as the billing list and the invoice read it.

        A `description` field was published here until 2026-09-09. No column
        ever backed it, so it was null on every order; it is replaced by
        `plan`, which is what the website's billing table and invoice actually
        print.
      properties:
        reference: { type: string, description: 'The merchant reference. This is the id GET /subscription/orders/{reference} takes.' }
        status: { type: string, description: 'pending | completed | failed | cancelled.' }
        amount: { type: string, description: 'What was actually paid, not the current plan price.' }
        currency: { type: string }
        plan:
          type: object
          nullable: true
          description: |
            What was bought, when the order points at a subscription plan.
            Null for any other payable — the table is polymorphic and is meant
            to carry rentals and merchandise later.
          properties:
            name: { type: string }
            billing_period: { type: string, nullable: true, description: 'daily | weekly | monthly | yearly.' }
        payment_method: { type: string, nullable: true, description: 'card, mpesa, airtel. Null until the gateway reports one.' }
        tracking_id: { type: string, nullable: true, description: 'The gateway-assigned id, for reconciling against a statement.' }
        created_at: { type: string, format: date-time, nullable: true }

    SpendTotals:
      type: object
      description: |
        What this account has actually spent, across every page of the order
        list rather than the page in hand.

        **Summed in SQL over a decimal column, and completed orders only.** A
        client cannot compute this: it holds only the pages it has fetched, so
        a total added up there is the first fifteen orders wearing the word
        "total". A pending charge is not money that has left an account and a
        failed one certainly is not.

        **`spent` and `currency` are both null when the account has paid in
        more than one currency**, because one figure formed by adding
        shillings to dollars is the worst answer available - it looks exactly
        like a right one. `orders` stays honest either way: it counts orders,
        not money. A client that gets null draws no summary.
      properties:
        spent: { type: string, nullable: true, description: 'A decimal string with two places, the same shape as an order amount. Never a number.' }
        currency: { type: string, nullable: true }
        orders: { type: integer, description: 'How many completed orders, across every currency.' }

    ReferralDashboard:
      type: object
      properties:
        code: { type: string, nullable: true }
        share_url: { type: string, nullable: true }
        currency: { type: string }
        stats:
          type: object
          properties:
            balance: { type: string, nullable: true }
            total_earned: { type: string, nullable: true }
            total_referrals: { type: integer }
            qualified: { type: integer }
        terms:
          type: object
          properties:
            reward_percent: { type: string, description: 'Percent of a payment credited to the referrer.' }
            discount_percent: { type: string, description: "Percent off the referred viewer's first payment." }
            min_withdrawal: { type: string }

    Withdrawal:
      type: object
      description: |
        One cash-out request. `rejection_reason` is a clerk's internal note and is
        returned only on a rejected row, where it is the one thing the viewer needs;
        on every other status it is null.
      properties:
        id: { type: integer }
        amount: { type: string }
        currency: { type: string }
        status:
          type: string
          enum: [requested, approved, paid, rejected]
        reference:
          type: string
          nullable: true
          description: The mobile-money transaction reference, once it has been paid.
        rejection_reason: { type: string, nullable: true }
        requested_at: { type: string, format: date-time, nullable: true }

    Wallet:
      type: object
      properties:
        currency: { type: string }
        balance: { type: string }
        min_withdrawal: { type: string }
        has_open_withdrawal:
          type: boolean
          description: |
            Whether a request is already in flight. Computed from the same statuses
            the service guards on, so a client's button and the server's rule cannot
            disagree about what "open" means.
        withdrawals:
          type: array
          description: The ten most recent, newest first.
          items: { $ref: '#/components/schemas/Withdrawal' }
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              type: { type: string }
              amount: { type: string }
              balance_after: { type: string }
              currency: { type: string }
              memo: { type: string, nullable: true }
              created_at: { type: string, format: date-time, nullable: true }
        next_cursor: { type: string, nullable: true }

    Notification:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        icon:
          type: string
          description: |
            A Phosphor icon name, as the website's own inbox uses — `ph-film-strip`,
            `ph-device-mobile`, `ph-bell`. The app maps these onto the same glyphs.
        colour:
          type: string
          description: |
            Which tone the icon tile wears. The website paints it as
            `bg-{colour}-subtle` on `text-{colour}-emphasis`; the app captures those
            pairs so both surfaces tint a notification identically.
          enum: [primary, success, warning, danger, info]
        image_url: { type: string, nullable: true }
        action_url: { type: string, nullable: true }
        category:
          type: string
          nullable: true
          description: |
            Which filter chip this notification sits under, or null when it belongs
            under All alone. Derived from the notification's stored class, so rows
            written before the chips existed still answer it.
          enum: [movies, series, account, offers]
        read: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }

    NotificationChannels:
      type: object
      description: |
        The viewer's global per-channel switch. Layer 4 of the four-layer gate: a
        channel fires only when every layer allows it, so switching one off here
        silences it regardless of any per-type preference.
      properties:
        in_app: { type: boolean }
        email: { type: boolean }
        push: { type: boolean }

    NotificationPreference:
      type: object
      properties:
        key: { type: string, maxLength: 100 }
        in_app: { type: boolean }
        email: { type: boolean }
        push: { type: boolean }

    Author:
      type: object
      nullable: true
      description: Only what attribution needs. No email address, ever.
      properties:
        username: { type: string }
        name: { type: string, description: 'Full name, falling back to the username.' }

    Suggestion:
      type: object
      properties:
        type: { type: string, enum: [movie, series] }
        slug: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        poster_url: { type: string }

    TaxonomyPage:
      type: object
      description: |
        An archive screen. The subject is under its own key - `genre`,
        `category`, `vj` or `person` - and its titles come back as two lists
        rather than one merged one, because the app renders them as separate
        rails and the two tables share no sort key.
      properties:
        genre: { $ref: '#/components/schemas/GenreCard' }
        category: { $ref: '#/components/schemas/CategoryCard' }
        vj: { $ref: '#/components/schemas/VjDetail' }
        tag: { $ref: '#/components/schemas/GenreCard' }
        person: { $ref: '#/components/schemas/PersonDetail' }
        movies: { type: array, items: { $ref: '#/components/schemas/MovieCard' } }
        series: { type: array, items: { $ref: '#/components/schemas/SeriesCard' } }

    CategoryCard:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        cover_url: { type: string }
        visible_home: { type: boolean, description: Whether the admin put this category on the homepage. }

    VjDetail:
      allOf:
        - $ref: '#/components/schemas/VjCard'
        - type: object
          properties:
            description: { type: string, nullable: true }
            links:
              type: object
              description: Only the platforms this VJ actually has. Absent keys mean no account.
              properties:
                youtube: { type: string }
                tiktok: { type: string }
                facebook: { type: string }
                instagram: { type: string }
                website: { type: string }

    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/PersonCard'
        - type: object
          properties:
            bio: { type: string, nullable: true }
            known_for: { type: string, nullable: true }

    HistoryEntry:
      type: object
      properties:
        item:
          oneOf:
            - $ref: '#/components/schemas/MovieCard'
            - $ref: '#/components/schemas/Episode'
        position_seconds: { type: integer }
        progress_percent: { type: integer }
        completed: { type: boolean }
        watched_at: { type: string, format: date-time, nullable: true }

    GenreCard:
      type: object
      description: kind = genres.
      properties:
        slug: { type: string }
        name: { type: string }
        colour: { type: string, nullable: true }
        image_url:
          type: string
          nullable: true
          description: |
            The tile's artwork. A genre owns no image of its own, so this is
            borrowed from its most recent published title - backdrop first,
            poster second, movies before series. It is the same
            `featured_image_url` the website's `card-genres-grid` draws, so
            both surfaces show the same picture for the same genre.

            Null for a genre with no published content. Draw the label on the
            surface colour rather than an empty frame.
        movies_count: { type: integer, nullable: true }
        shows_count: { type: integer, nullable: true }

    VjCard:
      type: object
      description: kind = vjs.
      properties:
        slug: { type: string }
        name: { type: string }
        image_url: { type: string, description: Falls back through the VJ's most recent published title. }
        movies_count: { type: integer, nullable: true }
        shows_count: { type: integer, nullable: true }

    PersonCard:
      type: object
      description: kind = people.
      properties:
        slug: { type: string }
        name: { type: string }
        image_url: { type: string }

    MovieCard:
      type: object
      description: |
        No video URL appears in any catalogue response. A playable URL comes
        only from POST /playback/sessions, after the entitlement check.
      properties:
        type: { type: string, enum: [movie] }
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        runtime_minutes: { type: integer, nullable: true }
        rating:
          type: string
          nullable: true
          description: |
            A content certification - G, PG, PG-13, R, NC-17 - NOT a star
            rating. The website renders it as a certification badge
            (hero-banner.blade.php falls back to the literal 'PG'). The
            five-star display that used to sit beside it was removed from
            BOTH surfaces on 2026-09-10: it came from
            `ratings()->avg('stars') ?? 5` over a table nothing in the product
            can write to, so it was always the fallback. No endpoint exposes a
            star rating. See docs/adr/0006.
            Typed as a number until 2026-09-09, which would have had the app
            drawing "NC-17" stars.
        poster_url: { type: string }
        tier_required:
          type: string
          nullable: true
          description: Plan slug this title needs, or null for free. Draw the lock badge from this.

    MovieHero:
      description: |
        A movie as the home banner draws it: the card plus what
        `components/partials/hero-banner.blade.php` renders and no more. Not
        MovieDetail, because the banner is on the critical path of every first
        paint and never draws `views_count`, `published_at` or `categories`.
      allOf:
        - $ref: '#/components/schemas/MovieCard'
        - type: object
          properties:
            backdrop_url:
              type: string
              description: |
                Already falls back to the poster server-side, so this is never
                null and the client needs no chain of its own. A title with no
                backdrop uploaded therefore sends a 5:7 poster for a 16:9 box -
                crop it, as the website's `background-size: cover` does.
            synopsis: { type: string, nullable: true }
            genres:
              type: array
              description: At most three, matching the blade's own `take(3)`.
              items: { $ref: '#/components/schemas/Taxonomy' }
            tags:
              type: array
              description: At most three. The banner's "Tags:" line.
              items: { $ref: '#/components/schemas/Taxonomy' }
            cast:
              type: array
              description: |
                At most three, deduplicated by person. The banner's
                "Starring:" line, which is text - no photo is sent because
                none is drawn.
              items: { $ref: '#/components/schemas/Taxonomy' }

    SeriesHero:
      description: |
        A series as the home banner draws it. Two fields a movie has no need
        of: the badge reads "N season" where a movie's reads its
        certification, and a show carries no `runtime_minutes` for the clock
        line.
      allOf:
        - $ref: '#/components/schemas/SeriesCard'
        - type: object
          properties:
            backdrop_url: { type: string }
            synopsis: { type: string, nullable: true }
            genres: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            tags: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            cast: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            seasons_count:
              type: integer
              nullable: true
              description: The banner's badge, and the thumbnail strip's meta line.
            episode_runtime_minutes:
              type: integer
              nullable: true
              description: |
                The MEAN episode length, whole minutes, and deliberately not
                the website's number. The blade shows the runtime of the first
                episode of whichever season loaded first, found by walking
                every episode of the series into memory. Null draws no clock
                line, exactly as a null runtime does on the website.

    RankedSlide:
      type: object
      description: |
        What makes a banner slide a RANKED banner slide. Both daily shelves
        backfill from all-time popularity when a day is quiet, and the website
        will not print a rank a title did not earn - it says "Popular on
        Jambo" instead. Position alone cannot tell the two apart, so the
        server says which. The viewer count itself is never sent: the surfaces
        draw a label, not a number.
      properties:
        rank:
          type: integer
          description: 1-based position in this shelf, today. Not stored anywhere.
        ranked_today:
          type: boolean
          description: |
            True when this position came from real viewing in the window.
            False means it was padded in from all-time popularity - draw
            "Popular on Jambo", not "#3 in Movies Today".

    MovieBannerSlide:
      description: |
        A movie as the Top 10 Movies of the Day banner draws it
        (`components/partials/vertical-banner.blade.php`). A hero minus the
        Tags and Starring lines, which that banner does not draw, plus the
        rank. Ten of these are on the home payload, so the fields it does not
        render are worth not sending.
      allOf:
        - $ref: '#/components/schemas/MovieCard'
        - $ref: '#/components/schemas/RankedSlide'
        - type: object
          properties:
            backdrop_url:
              type: string
              description: Already falls back to the poster server-side, as on MovieHero.
            synopsis: { type: string, nullable: true }
            genres:
              type: array
              description: |
                At most FOUR, not the hero's three, because the blade slices
                this one with `->take(4)`.
              items: { $ref: '#/components/schemas/Taxonomy' }

    SeriesBannerSlide:
      description: |
        A series as the Top 10 Series of the Day banner draws it
        (`components/partials/tab-series-slide.blade.php`). Carries no genres:
        that banner draws a release month and a season count instead.

        The episode list in the blade is not here because it is not drawn - it
        sits in a `d-none d-lg-block` column that no phone ever shows.
      allOf:
        - $ref: '#/components/schemas/SeriesCard'
        - $ref: '#/components/schemas/RankedSlide'
        - type: object
          properties:
            backdrop_url: { type: string }
            synopsis: { type: string, nullable: true }
            published_at:
              type: string
              format: date-time
              nullable: true
              description: |
                The banner's release line, rendered "August 2023". Never null
                in practice: every title in this shelf came through
                `Show::published()`, which requires one.
            seasons_count:
              type: integer
              nullable: true
              description: The other half of the meta line, rendered "2 Seasons".

    MovieDetail:
      allOf:
        - $ref: '#/components/schemas/MovieCard'
        - type: object
          properties:
            synopsis: { type: string, nullable: true }
            backdrop_url: { type: string }
            trailer_url: { type: string, nullable: true }
            published_at: { type: string, format: date-time, nullable: true }
            views_count: { type: integer }
            genres: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            categories: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            cast: { type: array, items: { $ref: '#/components/schemas/Person' } }

    WatchlistCard:
      description: |
        A saved title, as the WATCHLIST screen draws it — the ordinary card
        plus the three things the website's own watchlist card shows and a
        rail's card does not.

        `resources/views/profile-hub/watchlist.blade.php` passes
        `card-style.blade.php` a `cardGenres` of the first two genre names and
        a `movietime` reading "2h 49m" for a movie or "N seasons" for a show.
        These fields are what that component consumes, so the app can draw the
        same card the web draws. They are on THIS endpoint only: a home screen
        is thirteen rails of thirty cards and none of them show genres.
      allOf:
        - oneOf:
            - $ref: '#/components/schemas/MovieCard'
            - $ref: '#/components/schemas/SeriesCard'
            - $ref: '#/components/schemas/Episode'
        - type: object
          properties:
            genres:
              type: array
              description: At most two names, matching what the website's card takes.
              items:
                type: string
            season_number:
              type: integer
              nullable: true
              description: |
                Episodes only. The season it sits in, so a card can read
                "S01E02 — Name" as `widgets/watchlist-detail-card.blade.php`
                composes it. `season_id` identifies the row and tells a viewer
                nothing.
            seasons_count:
              type: integer
              nullable: true
              description: |
                Series only. Null rather than 0 when it was not counted — "0
                Seasons" on a series a viewer can watch is a lie, and an absent
                value lets the client draw nothing instead.
            play:
              nullable: true
              description: |
                What this card's Play control opens, resolved server-side by
                `WatchlistPlayResolver` — the same service
                `/watchlist/series/{slug}` uses on the website. **A series
                resolves to the most recent UNFINISHED episode**, and only
                falls back to the first episode when there is nothing to
                resume, so "pick up where you left off" is true on both
                clients.

                Null when there is nothing to play: an unreleased title, or a
                series with no episodes. Draw no control rather than a
                disabled one.
              type: object
              properties:
                type:
                  type: string
                  enum: [movie, episode]
                id:
                  type: integer
    SeriesCard:
      type: object
      properties:
        type: { type: string, enum: [series] }
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        rating:
          type: string
          nullable: true
          description: |
            A content certification - G, PG, PG-13, R, NC-17 - NOT a star
            rating. The website renders it as a certification badge
            (hero-banner.blade.php falls back to the literal 'PG'). The
            five-star display that used to sit beside it was removed from
            BOTH surfaces on 2026-09-10: it came from
            `ratings()->avg('stars') ?? 5` over a table nothing in the product
            can write to, so it was always the fallback. No endpoint exposes a
            star rating. See docs/adr/0006.
            Typed as a number until 2026-09-09, which would have had the app
            drawing "NC-17" stars.
        poster_url: { type: string }
        tier_required:
          type: string
          nullable: true
          description: What this series' episodes inherit when they carry no plan of their own.

    SeriesDetail:
      allOf:
        - $ref: '#/components/schemas/SeriesCard'
        - type: object
          properties:
            synopsis: { type: string, nullable: true }
            backdrop_url: { type: string }
            trailer_url: { type: string, nullable: true }
            published_at: { type: string, format: date-time, nullable: true }
            views_count: { type: integer }
            genres: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            categories: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            cast: { type: array, items: { $ref: '#/components/schemas/Person' } }
            seasons: { type: array, items: { $ref: '#/components/schemas/Season' } }

    Season:
      type: object
      properties:
        id: { type: integer }
        number: { type: integer }
        title: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        poster_url: { type: string }
        episodes: { type: array, items: { $ref: '#/components/schemas/Episode' } }

    Episode:
      type: object
      properties:
        type: { type: string, enum: [episode] }
        id: { type: integer }
        season_id: { type: integer }
        number: { type: integer }
        title: { type: string }
        synopsis: { type: string, nullable: true }
        runtime_minutes: { type: integer, nullable: true }
        still_url: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        tier_required:
          type: string
          nullable: true
          description: |
            The episode's OWN plan, usually null because the admin sets it on
            the series. Do NOT read null here as "free".
        effective_tier_required:
          type: string
          nullable: true
          description: The plan that actually governs playback, series inheritance applied. Draw the lock from this.

    Taxonomy:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }

    Person:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        photo_url: { type: string }

    MovieList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MovieCard' } }
        next_cursor: { type: string, nullable: true, description: null at the end of the list. }
        per_page: { type: integer }

    SeriesList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SeriesCard' } }
        next_cursor: { type: string, nullable: true }
        per_page: { type: integer }

    PlaybackSession:
      type: object
      properties:
        source: { type: string, enum: [file, embed] }
        url:
          type: string
          description: |
            Present when source is `file`. A token-signed CDN URL with a limited
            life. Hand it straight to the player; do not log it or put it in a
            WebView.
        embed_url: { type: string, description: Present when source is `embed`. }
        quality: { type: string, enum: [default, low] }
        available_qualities: { type: array, items: { type: string, enum: [default, low] } }
        resume_position: { type: integer, description: Seconds. 0 for a title already finished. }
        runtime_minutes: { type: integer, nullable: true }
        heartbeat_seconds:
          type: integer
          description: How often to call /playback/heartbeat. Server-controlled so it can be retuned without a Play release.
