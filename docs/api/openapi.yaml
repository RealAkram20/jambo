openapi: 3.0.3

# The contract the Jambo mobile and TV app is written against.
#
# Hand-maintained, and kept honest by tests/Feature/Api/V1/OpenApiSpecTest.php,
# which fails when a route exists that this file does not describe. That test is
# the reason to edit this file in the same commit as an endpoint, not later:
# drift between a shipped APK and a live server cannot be hot-fixed the way a
# web page can.
#
# Two rules that apply everywhere and are not repeated per endpoint:
#   * Every response uses the envelope in components/schemas/Envelope*.
#   * Clients branch on `code`, never on `message`. Message text is reworded;
#     codes are a contract and only change with a new API version.

info:
  title: Jambo API
  version: 1.0.0
  description: |
    Catalogue, authentication, devices and playback for the Jambo Android and
    Android TV app. Introduced 2026-09-08 alongside
    `docs/plans/mobile-offline-app.md`.

    Download and offline endpoints are Phase 3 and are not described here yet.

servers:
  - url: https://jambofilms.com/api/v1
    description: production
  - url: http://localhost:8090/api/v1
    description: local

tags:
  - name: App
  - name: Auth
  - name: Devices
  - name: Catalogue
  - name: Playback
  - name: Viewer

security:
  - bearerAuth: []

paths:
  /app/config:
    get:
      tags: [App]
      summary: Client configuration and the server clock
      description: |
        Called unauthenticated on launch. `server_time` is the anchor the app
        uses for offline licence checks (ADR-0003): a wall clock earlier than
        the last known server time is treated as rollback.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AppConfig'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and receive a device-bound token
      description: |
        Shares the website login's throttle bucket, keyed on email plus IP.
        When the account has two-factor enabled this returns 422
        `TWO_FACTOR_REQUIRED` with a `challenge_token`; no token is issued and
        no device row is created until the challenge is answered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '401':
          description: INVALID_CREDENTIALS
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: ACCOUNT_DEACTIVATED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '422':
          description: VALIDATION_FAILED, or TWO_FACTOR_REQUIRED with a challenge_token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeError'
                  - properties:
                      challenge_token:
                        type: string
                        description: Present only for TWO_FACTOR_REQUIRED. Not an access token.
        '429':
          description: RATE_LIMITED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /auth/2fa/challenge:
    post:
      tags: [Auth]
      summary: Complete a two-factor sign-in
      description: |
        Send either `code` (TOTP) or `recovery_code`. A wrong code does not
        consume the challenge, so a typo does not send the viewer back to the
        password screen; the challenge still expires on its own after 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token]
              properties:
                challenge_token: { type: string }
                code: { type: string, description: Six-digit TOTP }
                recovery_code: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '401':
          description: TWO_FACTOR_CHALLENGE_EXPIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '422':
          description: TWO_FACTOR_INVALID
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account and sign in
      description: |
        Same validation, default role and Registered event as the website, so
        an account created here is indistinguishable from one created in a
        browser. The viewer is signed in immediately and a device row is
        created, exactly as the web form logs you in.

        The website's honeypot and reCAPTCHA do NOT apply: a native form has no
        DOM for a bot to fill and no browser token to produce. The route's
        throttle and the SignupAttempt log carry that weight instead.

        The account is usable before the email is verified; show a banner, not
        a wall, matching the site.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, username, email, password, password_confirmation, device]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-zA-Z0-9_.\-]+$'
                  description: |
                    Becomes the account's referral code and its profile URL
                    (/{username}), so reserved words are refused.
                email: { type: string, format: email }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
                device: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Session'
                          - type: object
                            properties:
                              email_verified: { type: boolean }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '429':
          description: RATE_LIMITED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /auth/google:
    post:
      tags: [Auth]
      summary: Sign in with a Google ID token
      description: |
        The app obtains an ID token from Google's own sign-in SDK and sends it
        here; the server verifies it with Google, checks the audience matches
        this app's client id, and issues a Jambo device token.

        The audience check is the point: a valid Google token issued to another
        app is still a valid Google token.

        Google being unreachable answers INVALID_CREDENTIALS rather than
        allowing the sign-in. Two-factor still applies — Google proves the
        mailbox, not possession of the authenticator.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, device]
              properties:
                id_token: { type: string, description: The ID token from Google Sign-In. }
                device: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401':
          description: INVALID_CREDENTIALS — unverifiable token, wrong audience, or no proven email
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: ACCOUNT_DEACTIVATED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '422':
          description: TWO_FACTOR_REQUIRED, with a challenge_token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeError'
                  - properties:
                      challenge_token: { type: string }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: |
        The response is identical whether or not the address has an account —
        echoing the real status would turn this into an account-enumeration
        oracle. The mail only goes out when the account is real. The link lands
        on the website.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Always, whether or not the account exists
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete a password reset
      description: |
        Signs out every device on the account. A reset is usually someone
        recovering an account they believe was compromised, so leaving other
        sessions alive would defeat it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string, description: From the emailed link. }
                email: { type: string, format: email }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Password reset
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '422':
          description: VALIDATION_FAILED — expired or wrong token
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /auth/password:
    put:
      tags: [Auth]
      summary: Change your password
      description: |
        Requires the current password: knowing it is what separates the account
        owner from someone holding a stolen handset.

        Signs out every OTHER device. The device making the change keeps
        working, so the viewer is not thrown out of the app they are in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Changed
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /auth/email:
    get:
      tags: [Auth]
      summary: Is this account's email verified
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          email: { type: string }
                          verified: { type: boolean }

  /auth/email/resend:
    post:
      tags: [Auth]
      summary: Send the verification email again
      description: |
        Throttled below the read endpoints, because it sends mail. An
        already-verified account answers success without sending anything, so a
        retrying client cannot generate mail.
      responses:
        '200':
          description: Sent, or already verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          verified: { type: boolean }
        '429':
          description: RATE_LIMITED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out this device only
      description: Deletes the calling token and marks its device revoked. Other devices are untouched.
      responses:
        '200':
          description: Signed out
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /me:
    get:
      tags: [Auth]
      summary: The signed-in viewer, their plan and their caps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Me'
        '401':
          description: UNAUTHENTICATED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /profile:
    get:
      tags: [Viewer]
      summary: The profile screen
      description: '`GET /me` stays small for launch; this is the editable surface.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          profile: { $ref: '#/components/schemas/Profile' }
    patch:
      tags: [Viewer]
      summary: Edit the profile
      description: |
        Changing the account email requires `current_password` and clears the
        verified flag. Email is the account's recovery anchor: with a stolen
        token an attacker could swap it and then reset their way into a full
        takeover.

        Accounts created through Google have a random password, so those
        viewers set one via password reset before they can change their email —
        the same as on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, username, email]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                username: { type: string, minLength: 3, maxLength: 50 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 32, nullable: true }
                current_password:
                  type: string
                  format: password
                  description: Required only when the email is changing.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          profile: { $ref: '#/components/schemas/Profile' }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /profile/avatar:
    post:
      tags: [Viewer]
      summary: Replace the profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary, description: 'jpeg, png, webp or gif, up to 2 MB.' }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    delete:
      tags: [Viewer]
      summary: Remove the profile photo
      responses:
        '200':
          description: Removed
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /account/security:
    get:
      tags: [Viewer]
      summary: Two-factor state for this account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/SecurityState' }

  /account/2fa:
    post:
      tags: [Viewer]
      summary: Start two-factor setup
      description: |
        Mints a pending secret and recovery codes and returns them. Render the
        QR in the app from `secret`.

        **Two-factor is NOT on after this call.** It is on only once
        /account/2fa/confirm succeeds — a one-shot enable would let someone
        lock themselves out with a mis-scanned code.
      responses:
        '200':
          description: Setup started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          secret: { type: string }
                          recovery_codes: { type: array, items: { type: string } }
    delete:
      tags: [Viewer]
      summary: Turn two-factor off
      description: Requires the password. Removing a second factor must cost more than holding an unlocked handset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200':
          description: Disabled
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /account/2fa/confirm:
    post:
      tags: [Viewer]
      summary: Finish two-factor setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Two-factor is on
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          recovery_codes: { type: array, items: { type: string } }
        '422':
          description: TWO_FACTOR_INVALID
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /account/2fa/recovery-codes:
    post:
      tags: [Viewer]
      summary: Generate a fresh batch of recovery codes
      description: The previous batch stops working immediately.
      responses:
        '200':
          description: New codes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          recovery_codes: { type: array, items: { type: string } }
        '422':
          description: VALIDATION_FAILED — two-factor is not on
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /account:
    delete:
      tags: [Viewer]
      summary: Deactivate this account
      description: |
        Costs the password and an explicit confirmation. Signs out every
        device: a deactivated account is one sign-in refuses, so leaving live
        tokens would let the app keep watching until somebody noticed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password: { type: string, format: password }
                confirm: { type: boolean, description: Must be true. }
      responses:
        '200':
          description: Deactivated
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /devices:
    get:
      tags: [Devices]
      summary: App installs signed into this account
      description: |
        Browser sessions AND app installs, most recent first. Either list
        alone is half the account: a viewer who hits their stream cap because
        of a laptop at home needs to free that slot from their phone.

        Revoked devices are omitted, and a browser session idle past the
        session lifetime is not listed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          devices:
                            type: array
                            items: { $ref: '#/components/schemas/Device' }
                          counts_app_devices:
                            type: boolean
                            description: |
                              Whether app installs currently count against the
                              concurrent-device cap. Ships false; browser
                              sessions always count.

  /devices/{uuid}:
    delete:
      tags: [Devices]
      summary: Sign a device out
      description: |
        Deletes that device's token and stops whatever it was playing counting
        against the concurrent-stream cap. A uuid on another account answers
        DEVICE_NOT_FOUND rather than 403, so the endpoint cannot be used to
        discover that a device exists elsewhere.
      parameters:
        - name: uuid
          in: path
          required: true
          description: A device uuid or a browser session id — either is accepted.
          schema: { type: string, pattern: '^[A-Za-z0-9\-_]{8,64}$' }
      responses:
        '200':
          description: Device signed out
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '404':
          description: DEVICE_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /home:
    get:
      tags: [Catalogue]
      summary: The home screen
      description: |
        Calls the same HomeRailsService the website's view composer calls, so
        the rails, their order and the rules that pick them are the website's.
        Section headings come from the same `sectionTitle` translation keys the
        blades render.

        Public, but personalising: send a bearer token and Continue Watching
        appears and the personalised rails become personal. Without one the
        response is the guest home screen rather than an error.

        `rails` is an ordered list, not a fixed object, so a rail added
        server-side needs no app release. Empty rails are omitted entirely.
        Render by `kind`, not by `key`.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Home'

  /movies:
    get:
      tags: [Catalogue]
      summary: Published movies, newest first
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, default: 24, maximum: 60 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/MovieList'

  /movies/{slug}:
    get:
      tags: [Catalogue]
      summary: One movie
      description: |
        Reachable for published and upcoming titles. `is_released` says whether
        it can be watched yet, which is not the same as whether this viewer may
        watch it — that is answered by POST /playback/sessions.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          movie: { $ref: '#/components/schemas/MovieDetail' }
                          is_released: { type: boolean }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /series:
    get:
      tags: [Catalogue]
      summary: Published series, newest first
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, default: 24, maximum: 60 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SeriesList'

  /series/{slug}:
    get:
      tags: [Catalogue]
      summary: One series with its seasons and episodes
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          series: { $ref: '#/components/schemas/SeriesDetail' }
                          is_released: { type: boolean }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /episodes/{id}:
    get:
      tags: [Catalogue]
      summary: One episode and the series it belongs to
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
