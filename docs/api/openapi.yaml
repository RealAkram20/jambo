          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          vjs: { type: array, items: { $ref: '#/components/schemas/VjCard' } }

  /vjs/{slug}:
    get:
      tags: [Catalogue]
      summary: One VJ, their links and their titles
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/TaxonomyPage' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /cast/{slug}:
    get:
      tags: [Catalogue]
      summary: One cast member and their titles
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/TaxonomyPage' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /{type}/{slug}/reviews:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string, enum: [movies, series] } }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Viewer]
      summary: The review thread for a title
      description: |
        Published reviews, newest first, plus the aggregate shown beside the
        stars and this viewer's own review — so a detail screen needs one
        request rather than three.

        Public, but send a bearer token to get `mine` populated.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/ReviewThread' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    post:
      tags: [Viewer]
      summary: Write or replace your review
      description: |
        One review per viewer per title. Posting again edits the existing one
        rather than adding a second, which also makes this safe to retry.
        Only a genuinely new review notifies an admin; an edit does not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars, body]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 200, nullable: true }
                body: { type: string, minLength: 3, maxLength: 4000 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          review: { $ref: '#/components/schemas/Review' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    delete:
      tags: [Viewer]
      summary: Remove your review
      description: Idempotent — removing one that is not there is a success.
      responses:
        '200':
          description: Removed
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /episodes/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Viewer]
      summary: The comment thread under an episode
      description: |
        Approved top-level comments, newest first, each with its replies
        nested. Public, but send a bearer token to get `is_mine` populated.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/CommentThread' } }
                          next_cursor: { type: string, nullable: true }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    post:
      tags: [Viewer]
      summary: Post a comment or a reply
      description: A `parent_id` must belong to the same episode, or the reply is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 2, maxLength: 2000 }
                parent_id: { type: integer, nullable: true, description: The comment being replied to. }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          comment: { $ref: '#/components/schemas/Comment' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '422':
          description: VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /comments/{id}:
    delete:
      tags: [Viewer]
      summary: Delete your own comment
      description: |
        Admins may delete any. Somebody else's comment answers NOT_FOUND
        rather than 403, so the endpoint cannot be used to confirm a comment
        exists.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Removed
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /notifications:
    get:
      tags: [Viewer]
      summary: The viewer's notifications
      description: |
        **This is the fallback that makes push safe.** Push is an accelerator,
        never the transport — an OEM battery manager kills processes, tokens go
        stale, handsets sit offline for a day. Everything a push says is
        readable here, and the app must be usable with push switched off
        entirely.

        Carries `unread_count`, so a badge costs one request rather than two.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          unread_count: { type: integer }
                          items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                          next_cursor: { type: string, nullable: true }
    delete:
      tags: [Viewer]
      summary: Clear every notification
      responses:
        '200':
          description: Cleared
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /notifications/read-all:
    post:
      tags: [Viewer]
      summary: Mark everything read
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /notifications/{id}/read:
    post:
      tags: [Viewer]
      summary: Mark one read
      description: Idempotent — an already-read notification is a success.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /notifications/{id}:
    delete:
      tags: [Viewer]
      summary: Delete one
      description: Idempotent — deleting one already gone is a success, so a retry cannot fail.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /notifications/preferences:
    get:
      tags: [Viewer]
      summary: Per-category notification preferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          preferences: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } }
    put:
      tags: [Viewer]
      summary: Set preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  items: { $ref: '#/components/schemas/NotificationPreference' }
      responses:
        '200':
          description: Saved, and the full set returned
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /notifications/push-token:
    post:
      tags: [Viewer]
      summary: Register this install's FCM token
      description: |
        The token is stored against the device row, which means **signing out
        deletes it** — a shared handset must never keep the previous account's
        token and deliver their notifications to whoever is holding the phone.
        Booting the device from elsewhere clears it too.

        A token can belong to only one install: registering one already held
        elsewhere moves it. Android reissues the same token to a reinstall, and
        two rows holding it would mean one push delivered twice.

        `push_enabled` is this handset's own switch, separate from the
        per-category preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 512 }
                push_enabled: { type: boolean, nullable: true }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          registered: { type: boolean }
                          push_enabled: { type: boolean }
        '404':
          description: DEVICE_NOT_FOUND — this session has no device row to attach a token to
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    delete:
      tags: [Viewer]
      summary: Stop pushing to this install
      description: Signing out does this too. This is for the viewer who wants the app but not the notifications.
      responses:
        '200':
          description: Unregistered
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeOk' } } }

  /watchlist:
    get:
      tags: [Viewer]
      summary: The viewer's watchlist
      description: Rows whose title has since been deleted are dropped rather than returned as nulls.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              oneOf:
                                - $ref: '#/components/schemas/MovieCard'
                                - $ref: '#/components/schemas/SeriesCard'
                                - $ref: '#/components/schemas/Episode'
    post:
      tags: [Viewer]
      summary: Add a title to the watchlist
      description: |
        Idempotent — adding something already on the list succeeds and changes
        nothing, so a retry after a dropped connection is safe. This is
        deliberately not the website's toggle endpoint: a retried toggle
        silently undoes itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [movie, show, episode] }
                id: { type: integer }
      responses:
        '200':
          description: On the list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          in_list: { type: boolean }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /watchlist/{type}/{id}:
    delete:
      tags: [Viewer]
      summary: Remove a title from the watchlist
      description: Idempotent — removing something that is not on the list is a success, not a 404.
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [movie, show, episode] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Not on the list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          in_list: { type: boolean }

  /continue-watching:
    get:
      tags: [Viewer]
      summary: Continue Watching as its own screen
      description: |
        The same cards the home screen's `continue_watching` rail carries, from
        the same service, so the two cannot disagree about where the viewer
        stopped. Finished titles are excluded; see /history for those.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ContinueWatchingCard' }

  /history:
    get:
      tags: [Viewer]
      summary: Everything watched, newest first
      description: A record rather than a to-do list, so unlike Continue Watching it keeps finished titles.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/HistoryEntry' }
                          next_cursor: { type: string, nullable: true }

  /search/suggest:
    get:
      tags: [Catalogue]
      summary: Type-ahead suggestions
      description: |
        Deliberately thinner and shorter than /search — five of each and only
        the fields a dropdown row draws, because a viewer sends this on every
        keystroke over a mobile connection. Fewer than two characters returns
        an empty list rather than an error.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          query: { type: string }
                          suggestions: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }

  /tags:
    get:
      tags: [Catalogue]
      summary: Every tag
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          tags: { type: array, items: { $ref: '#/components/schemas/GenreCard' } }

  /tags/{slug}:
    get:
      tags: [Catalogue]
      summary: One tag and its published titles
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data: { $ref: '#/components/schemas/TaxonomyPage' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /cast:
    get:
      tags: [Catalogue]
      summary: Everyone with published work
      description: Ordered by how much of the catalogue they appear in, which is what makes the grid useful.
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/PersonCard' } }
                          next_cursor: { type: string, nullable: true }

  /collections:
    get:
      tags: [Catalogue]
      summary: Which "see all" collections exist
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          collections:
                            type: array
                            items:
                              type: object
                              properties:
                                key: { type: string }
                                title: { type: string }
                                type: { type: string, enum: [movie, show] }

  /collections/{rail}:
    get:
      tags: [Catalogue]
      summary: The full list behind a home rail
      description: |
        The same catalog the website's /collection/{rail} page uses, so the
        app's "see all" and the site's cannot diverge.

        Personalised rails (top-picks, smart-shuffle, fresh-picks) pin the
        viewer's own recommendations to the front, so send a bearer token to
        get a personal ordering.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: rail, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, default: 24, maximum: 60 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          key: { type: string }
                          title: { type: string }
                          items:
                            type: array
                            items:
                              oneOf:
                                - $ref: '#/components/schemas/MovieCard'
                                - $ref: '#/components/schemas/SeriesCard'
                          next_cursor: { type: string, nullable: true }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /pages:
    get:
      tags: [App]
      summary: The CMS pages
      description: |
        About, FAQ, Privacy, Terms. Generic on purpose: adding a page in the
        admin makes it available to the app with no release, and Google Play
        requires a subscription app to show its terms and privacy policy.

        Structural rows the website assembles into chrome (the footer, anything
        flagged system) are excluded from this list but remain fetchable by
        slug.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          pages:
                            type: array
                            items:
                              type: object
                              properties:
                                slug: { type: string }
                                title: { type: string }
                                summary: { type: string, nullable: true }

  /pages/{slug}:
    get:
      tags: [App]
      summary: One CMS page
      description: '`content` is admin-authored HTML, the same string the website renders.'
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          page:
                            type: object
                            properties:
                              slug: { type: string }
                              title: { type: string }
                              content: { type: string, description: Admin-authored HTML. }
                              summary: { type: string, nullable: true }
                              image_url: { type: string }
                              updated_at: { type: string, format: date-time, nullable: true }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /playback/sessions:
    post:
      tags: [Playback]
      summary: Authorize playback and get a URL
      description: |
        Runs the same entitlement rules as the website (PlaybackAuthorizer):
        release state, the site-wide sign-up switch, the plan level with an
        episode inheriting its series' plan, the admin bypass, and the
        concurrent-stream cap keyed on this device's uuid.

        `source` is `file` for titles Jambo hosts and `embed` for YouTube-backed
        ones, which cannot be downloaded and must be opened in an embed.

        A `low` request for a title with no data-saver rendition is refused
        rather than silently served at full size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [movie, episode] }
                id: { type: integer }
                quality: { type: string, enum: [default, low], default: default }
      responses:
        '200':
          description: Authorized
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PlaybackSession'
        '401':
          description: UNAUTHENTICATED or LOGIN_REQUIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: SUBSCRIPTION_REQUIRED or UPGRADE_REQUIRED, with `required_tier`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeError'
                  - properties:
                      required_tier: { $ref: '#/components/schemas/Tier' }
        '404':
          description: NOT_FOUND, or CONTENT_UNAVAILABLE for an unreleased title or a missing rendition
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '409':
          description: STREAM_LIMIT — entitled, but already watching on as many devices as the plan allows
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /playback/heartbeat:
    post:
      tags: [Playback]
      summary: Report playback position
      description: |
        Send every `heartbeat_seconds` while playing. Records the resume
        position, refreshes the live-stream signal the cap reads, and raises the
        event partner earnings accrue from — the same recorder the website uses.

        A 409 means this device was booted from the account mid-stream: stop
        playing and sign out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id, position]
              properties:
                type: { type: string, enum: [movie, episode] }
                id: { type: integer }
                position: { type: integer, minimum: 0, description: Seconds into the title }
                duration: { type: integer, minimum: 1, description: 'Player-reported runtime, when known' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          position: { type: integer }
                          completed: { type: boolean }
        '409':
          description: DEVICE_REVOKED — this device was signed out mid-stream
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Sanctum personal access token from /auth/login, bound to one device.

  schemas:
    EnvelopeOk:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { type: object }

    EnvelopeError:
      type: object
      required: [success, code, message, errors]
      properties:
        success: { type: boolean, enum: [false] }
        code:
          type: string
          description: Branch on this, never on `message`.
          enum:
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - ACCOUNT_DEACTIVATED
            - TWO_FACTOR_REQUIRED
            - TWO_FACTOR_INVALID
            - TWO_FACTOR_CHALLENGE_EXPIRED
            - DEVICE_REVOKED
            - DEVICE_NOT_FOUND
            - LOGIN_REQUIRED
            - SUBSCRIPTION_REQUIRED
            - UPGRADE_REQUIRED
            - STREAM_LIMIT
            - CONTENT_UNAVAILABLE
            - VALIDATION_FAILED
            - NOT_FOUND
            - FORBIDDEN
            - RATE_LIMITED
            - APP_UPDATE_REQUIRED
            - SERVER_ERROR
        message: { type: string }
        errors:
          type: object
          description: Field-keyed validation messages; empty object when not a validation failure.

    AppConfig:
      type: object
      properties:
        min_app_version: { type: string, example: '1.0.0' }
        server_time: { type: string, format: date-time }
        features:
          type: object
          properties:
            downloads: { type: boolean }
            in_app_subscribe: { type: boolean }
        support:
          type: object
          properties:
            site_url: { type: string }

    DeviceRegistration:
      type: object
      required: [uuid, platform]
      description: Generated by the app at first launch. The uuid is also this device's streaming session key.
      properties:
        uuid: { type: string, minLength: 8, maxLength: 64 }
        platform: { type: string, enum: [android, android_tv] }
        name: { type: string, maxLength: 120 }
        model: { type: string, maxLength: 120 }
        app_version: { type: string, maxLength: 32 }

    Profile:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        username:
          type: string
          description: Also the account's referral code and its profile URL.
        email: { type: string }
        phone: { type: string, nullable: true }
        email_verified: { type: boolean }
        avatar_url: { type: string, nullable: true }
        joined_at: { type: string, format: date-time, nullable: true }

    SecurityState:
      type: object
      properties:
        two_factor:
          type: object
          properties:
            enabled: { type: boolean }
            pending:
              type: boolean
              description: A secret exists but no code has confirmed it yet.
            secret:
              type: string
              nullable: true
              description: Only while pending or enabled. Render the QR from this.
            recovery_codes: { type: array, items: { type: string } }
        google_enabled: { type: boolean, description: Whether this server has Google sign-in configured. }
        email_verified: { type: boolean }

    Device:
      type: object
      description: |
        One thing signed into the account. `kind` says which: an app install or
        a browser session. `id` is the device uuid for an app and the session
        id for a browser — one field, because DELETE /devices/{id} takes
        either.
      properties:
        id: { type: string }
        kind: { type: string, enum: [app, browser] }
        name: { type: string, nullable: true, description: 'For a browser, the parsed user agent.' }
        model: { type: string, nullable: true, description: App installs only. }
        platform: { type: string, nullable: true, enum: [android, android_tv, null] }
        app_version: { type: string, nullable: true, description: App installs only. }
        ip_address: { type: string, nullable: true, description: Browser sessions only. }
        last_seen_at: { type: string, format: date-time, nullable: true }
        is_current: { type: boolean }

    Session:
      type: object
      properties:
        token: { type: string, description: Bearer token. Store securely; it does not expire on a timer. }
        device:
          type: object
          properties:
            uuid: { type: string }
            platform: { type: string }
            name: { type: string, nullable: true }
        user:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            email: { type: string }

    Tier:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        access_level: { type: integer }

    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer }
            first_name: { type: string }
            last_name: { type: string }
            username: { type: string }
            email: { type: string }
            is_admin: { type: boolean }
        subscription:
          type: object
          nullable: true
          properties:
            tier: { $ref: '#/components/schemas/Tier' }
            starts_at: { type: string, format: date-time, nullable: true }
            ends_at: { type: string, format: date-time, nullable: true }
        limits:
          type: object
          properties:
            max_concurrent_streams:
              type: integer
              nullable: true
              description: null means the plan sets no cap. Render "unlimited", not "none".
        server_time: { type: string, format: date-time }

    Home:
      type: object
      properties:
        hero:
          type: array
          description: Curated at /admin/featured, falling back to an automatic mix. Movies and series interleaved.
          items:
            oneOf:
              - $ref: '#/components/schemas/MovieCard'
              - $ref: '#/components/schemas/SeriesCard'
        rails:
          type: array
          items: { $ref: '#/components/schemas/Rail' }
        server_time: { type: string, format: date-time }

    Rail:
      type: object
      properties:
        key:
          type: string
          description: |
            Stable identifier. Category shelves are `category:<slug>`, so this
            set is open-ended - never switch on it exhaustively.
          example: top_movies
        title:
          type: string
          description: Already translated, and the same string the website renders.
        kind:
          type: string
          description: Which card component to render. Treat an unknown kind as a rail to skip.
          enum: [titles, progress, genres, vjs, people]
        items:
          type: array
          description: Shape depends on `kind`. Never empty - an empty rail is omitted.
          items:
            oneOf:
              - $ref: '#/components/schemas/MovieCard'
              - $ref: '#/components/schemas/SeriesCard'
              - $ref: '#/components/schemas/ContinueWatchingCard'
              - $ref: '#/components/schemas/GenreCard'
              - $ref: '#/components/schemas/VjCard'
              - $ref: '#/components/schemas/PersonCard'

    ContinueWatchingCard:
      type: object
      description: kind = progress.
      properties:
        title: { type: string }
        subtitle: { type: string, description: 'For a series, S01E02 and the episode title.' }
        image_url: { type: string }
        progress_percent: { type: integer }
        minutes_left: { type: integer }
        position_seconds: { type: integer }
        resume:
          type: object
          description: |
            What to play. For a series this is the EPISODE, not the show -
            deliberately different from `remove` below.
          properties:
            type: { type: string, enum: [movie, episode] }
            id: { type: integer }
        remove:
          type: object
          description: |
            What to forget. For a series this is the SHOW: the rail dedupes by
            show, so removing one episode would let the card re-surface.
          properties:
            type: { type: string, enum: [movie, show] }
            id: { type: integer }

    ReviewThread:
      type: object
      properties:
        stats:
          type: object
          properties:
            count: { type: integer }
            average:
              type: number
              description: |
                Rounded to one decimal, matching the website's star display.
                JSON drops a zero fraction, so a whole average arrives as 4
                rather than 4.0 - parse as a float.
        mine:
          allOf: [{ $ref: '#/components/schemas/Review' }]
          nullable: true
          description: This viewer's own review, or null. Requires a bearer token.
        items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        next_cursor: { type: string, nullable: true }

    Review:
      type: object
      properties:
        id: { type: integer }
        stars: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string, nullable: true }
        body: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        author: { $ref: '#/components/schemas/Author' }

    Comment:
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        author: { $ref: '#/components/schemas/Author' }
        is_mine: { type: boolean, description: Whether the signed-in viewer wrote it. False for guests. }

    CommentThread:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          properties:
            replies: { type: array, items: { $ref: '#/components/schemas/Comment' } }

    Notification:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        icon: { type: string }
        image_url: { type: string, nullable: true }
        action_url: { type: string, nullable: true }
        read: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }

    NotificationPreference:
      type: object
      properties:
        key: { type: string, maxLength: 100 }
        in_app: { type: boolean }
        email: { type: boolean }
        push: { type: boolean }

    Author:
      type: object
      nullable: true
      description: Only what attribution needs. No email address, ever.
      properties:
        username: { type: string }
        name: { type: string, description: 'Full name, falling back to the username.' }

    Suggestion:
      type: object
      properties:
        type: { type: string, enum: [movie, series] }
        slug: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        poster_url: { type: string }

    TaxonomyPage:
      type: object
      description: |
        An archive screen. The subject is under its own key - `genre`,
        `category`, `vj` or `person` - and its titles come back as two lists
        rather than one merged one, because the app renders them as separate
        rails and the two tables share no sort key.
      properties:
        genre: { $ref: '#/components/schemas/GenreCard' }
        category: { $ref: '#/components/schemas/CategoryCard' }
        vj: { $ref: '#/components/schemas/VjDetail' }
        tag: { $ref: '#/components/schemas/GenreCard' }
        person: { $ref: '#/components/schemas/PersonDetail' }
        movies: { type: array, items: { $ref: '#/components/schemas/MovieCard' } }
        series: { type: array, items: { $ref: '#/components/schemas/SeriesCard' } }

    CategoryCard:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        cover_url: { type: string }
        visible_home: { type: boolean, description: Whether the admin put this category on the homepage. }

    VjDetail:
      allOf:
        - $ref: '#/components/schemas/VjCard'
        - type: object
          properties:
            description: { type: string, nullable: true }
            links:
              type: object
              description: Only the platforms this VJ actually has. Absent keys mean no account.
              properties:
                youtube: { type: string }
                tiktok: { type: string }
                facebook: { type: string }
                instagram: { type: string }
                website: { type: string }

    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/PersonCard'
        - type: object
          properties:
            bio: { type: string, nullable: true }
            known_for: { type: string, nullable: true }

    HistoryEntry:
      type: object
      properties:
        item:
          oneOf:
            - $ref: '#/components/schemas/MovieCard'
            - $ref: '#/components/schemas/Episode'
        position_seconds: { type: integer }
        progress_percent: { type: integer }
        completed: { type: boolean }
        watched_at: { type: string, format: date-time, nullable: true }

    GenreCard:
      type: object
      description: kind = genres.
      properties:
        slug: { type: string }
        name: { type: string }
        colour: { type: string, nullable: true }
        movies_count: { type: integer, nullable: true }
        shows_count: { type: integer, nullable: true }

    VjCard:
      type: object
      description: kind = vjs.
      properties:
        slug: { type: string }
        name: { type: string }
        image_url: { type: string, description: Falls back through the VJ's most recent published title. }
        movies_count: { type: integer, nullable: true }
        shows_count: { type: integer, nullable: true }

    PersonCard:
      type: object
      description: kind = people.
      properties:
        slug: { type: string }
        name: { type: string }
        image_url: { type: string }

    MovieCard:
      type: object
      description: |
        No video URL appears in any catalogue response. A playable URL comes
        only from POST /playback/sessions, after the entitlement check.
      properties:
        type: { type: string, enum: [movie] }
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        runtime_minutes: { type: integer, nullable: true }
        rating: { type: number, nullable: true }
        poster_url: { type: string }
        tier_required:
          type: string
          nullable: true
          description: Plan slug this title needs, or null for free. Draw the lock badge from this.

    MovieDetail:
      allOf:
        - $ref: '#/components/schemas/MovieCard'
        - type: object
          properties:
            synopsis: { type: string, nullable: true }
            backdrop_url: { type: string }
            trailer_url: { type: string, nullable: true }
            published_at: { type: string, format: date-time, nullable: true }
            views_count: { type: integer }
            genres: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            categories: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            cast: { type: array, items: { $ref: '#/components/schemas/Person' } }

    SeriesCard:
      type: object
      properties:
        type: { type: string, enum: [series] }
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        rating: { type: number, nullable: true }
        poster_url: { type: string }
        tier_required:
          type: string
          nullable: true
          description: What this series' episodes inherit when they carry no plan of their own.

    SeriesDetail:
      allOf:
        - $ref: '#/components/schemas/SeriesCard'
        - type: object
          properties:
            synopsis: { type: string, nullable: true }
            backdrop_url: { type: string }
            trailer_url: { type: string, nullable: true }
            published_at: { type: string, format: date-time, nullable: true }
            views_count: { type: integer }
            genres: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            categories: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
            cast: { type: array, items: { $ref: '#/components/schemas/Person' } }
            seasons: { type: array, items: { $ref: '#/components/schemas/Season' } }

    Season:
      type: object
      properties:
        id: { type: integer }
        number: { type: integer }
        title: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        poster_url: { type: string }
        episodes: { type: array, items: { $ref: '#/components/schemas/Episode' } }

    Episode:
      type: object
      properties:
        type: { type: string, enum: [episode] }
        id: { type: integer }
        season_id: { type: integer }
        number: { type: integer }
        title: { type: string }
        synopsis: { type: string, nullable: true }
        runtime_minutes: { type: integer, nullable: true }
        still_url: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        tier_required:
          type: string
          nullable: true
          description: |
            The episode's OWN plan, usually null because the admin sets it on
            the series. Do NOT read null here as "free".
        effective_tier_required:
          type: string
          nullable: true
          description: The plan that actually governs playback, series inheritance applied. Draw the lock from this.

    Taxonomy:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }

    Person:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        photo_url: { type: string }

    MovieList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MovieCard' } }
        next_cursor: { type: string, nullable: true, description: null at the end of the list. }
        per_page: { type: integer }

    SeriesList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SeriesCard' } }
        next_cursor: { type: string, nullable: true }
        per_page: { type: integer }

    PlaybackSession:
      type: object
      properties:
        source: { type: string, enum: [file, embed] }
        url:
          type: string
          description: |
            Present when source is `file`. A token-signed CDN URL with a limited
            life. Hand it straight to the player; do not log it or put it in a
            WebView.
        embed_url: { type: string, description: Present when source is `embed`. }
        quality: { type: string, enum: [default, low] }
        available_qualities: { type: array, items: { type: string, enum: [default, low] } }
        resume_position: { type: integer, description: Seconds. 0 for a title already finished. }
        runtime_minutes: { type: integer, nullable: true }
        heartbeat_seconds:
          type: integer
          description: How often to call /playback/heartbeat. Server-controlled so it can be retuned without a Play release.
